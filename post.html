<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwapStop - Post Item</title>
    
    <link rel="stylesheet" href="post.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Serif+Display&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:10px;">
                <i class="fa-solid fa-recycle"></i> SwapStop
            </a>
        </div>
        <nav>
            <a href="index.html">Trade Local</a>
            <a href="categories.html">Categories</a>
            <a href="#">Overview</a>
            <a href="profile.html">Profile</a>
        </nav>
            <div class="header-right">
                <button class="btn btn-signin">Sign In</button>
                <button class="btn btn-post">Post</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        
        <div class="title-banner">
            <h1>POST AN ITEM TO SWAP</h1>
        </div>

        <div class="form-wrapper">
            <form id="postItemForm">
                
                <div class="upload-area" id="dropArea">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>Click or Drag to Upload Image</p>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                    <img id="imagePreview" src="#" alt="Preview" style="display:none;">
                </div>

                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" placeholder="Enter Item Name" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <div class="select-wrapper">
                        <select required>
                            <option value="" disabled selected>Select a Category</option>
                            <option value="electronics">Electronics</option>
                            <option value="furniture">Furniture</option>
                            <option value="fashion">Fashion</option>
                            <option value="books">Books</option>
                            <option value="sports">Sports</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Condition</label>
                    <div class="select-wrapper">
                        <select required>
                            <option value="new">New</option>
                            <option value="like-new">Used - Like New</option>
                            <option value="good">Used - Good</option>
                            <option value="fair">Used - Fair</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea rows="4" placeholder="Add item details..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" placeholder="Where are you located?" required>
                </div>

                <button type="submit" class="btn-submit">Submit Item</button>

            </form>
        </div>

    </div>

    <i class="fa-solid fa-recycle bg-recycle-icon-left"></i>
    <i class="fa-solid fa-recycle bg-recycle-icon-right"></i>

    <footer>
        <p>&copy; 2025 SwapStop. Trade Local, Waste Less.</p>
    </footer>

    <script src="post.js"></script>

</body>
</html>
